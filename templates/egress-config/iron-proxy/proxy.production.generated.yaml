dns:
  listen: "off"
  proxy_ip: "172.20.0.2"
proxy:
  http_listen: ":10000"
  https_listen: "off"
  max_request_body_bytes: 10485760
  upstream_response_header_timeout: "180s"
tls:
  ca_cert: "/var/lib/packetsafari/egress-proxy/ca.crt"
  ca_key: "/var/lib/packetsafari/egress-proxy/ca.key"
  cert_cache_size: 1000
  leaf_cert_expiry_hours: 8760
transforms:
  - name: allowlist
    config:
      domains:
        - "api.openai.com"
        - "api.paddle.com"
        - "auth.openai.com"
        - "crt.sh"
        - "email.eu-central-1.amazonaws.com"
        - "oidc.external.test"
        - "openrouter.ai"
        - "rules.emergingthreats.net"
        - "saml.external.test"
        - "sandbox-api.paddle.com"
        - "sslbl.abuse.ch"
        - "ti.stamus-networks.io"
        - "urlhaus.abuse.ch"
        - "www.gstatic.com"
        - "www.openinfosecfoundation.org"
        - "www.spamhaus.org"
  - name: secrets
    config:
      secrets:
        - source:
            type: "env"
            var: OPENAI_API_KEY
          proxy_value: "ps_proxy_openai_api_key"
          match_headers:
            - "Authorization"
          match_body: false
          rules:
            - host: "api.openai.com"
        - source:
            type: "env"
            var: OPENROUTER_API_KEY
          proxy_value: "ps_proxy_openrouter_api_key"
          match_headers:
            - "Authorization"
          match_body: false
          rules:
            - host: "openrouter.ai"
        - source:
            type: "env"
            var: PACKETSAFARI_PADDLE_API_KEY
          proxy_value: "ps_proxy_paddle_api_key"
          match_headers:
            - "Authorization"
          match_body: false
          rules:
            - host: "api.paddle.com"
            - host: "sandbox-api.paddle.com"
  - name: aws_auth
    config:
      access_key_id:
        type: "env"
        var: PACKETSAFARI_SES_AWS_ACCESS_KEY_ID
      secret_access_key:
        type: "env"
        var: PACKETSAFARI_SES_AWS_SECRET_ACCESS_KEY
      allowed_services:
        - "ses"
      allowed_regions:
        - "eu-central-1"
      rules:
        - host: "email.eu-central-1.amazonaws.com"
log:
  level: "info"
